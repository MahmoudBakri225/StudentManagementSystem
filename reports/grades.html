<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Grades Report</title><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap' rel='stylesheet'><style>    :root {
        --paper: #F6F3EC;
        --paper-raised: #FCFAF5;
        --ink: #23291F;
        --ink-soft: #6B6A5C;
        --rule: #D8D2C0;
        --emerald: #1F6F52;
        --brass: #A9822F;
        --rust: #A33B2B;
        --amber: #A8752E;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.6;
    }
    .letterhead {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 32px 56px 22px;
        border-bottom: 3px double var(--ink);
    }
    .seal {
        flex-shrink: 0;
        width: 54px; height: 54px;
        border-radius: 50%;
        border: 2px solid var(--brass);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Source Serif 4', Georgia, serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--brass);
        letter-spacing: -0.5px;
    }
    .letterhead-text h1 {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.7rem;
        font-weight: 600;
        color: var(--ink);
    }
    .letterhead-text p {
        font-size: 0.82rem;
        color: var(--ink-soft);
        margin-top: 2px;
    }
    .title-bar {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 8px;
        padding: 26px 56px 12px;
        border-bottom: 1px solid var(--rule);
    }
    .title-bar h2 {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.35rem;
        font-weight: 600;
        color: var(--ink);
    }
    .title-bar .date {
        font-size: 0.8rem;
        color: var(--ink-soft);
    }
    .content {
        padding: 12px 56px 60px;
        max-width: 1150px;
        margin: 0 auto;
    }
    h3 {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--ink);
        margin: 34px 0 14px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: var(--paper-raised);
        margin-bottom: 8px;
    }
    th {
        text-align: left;
        padding: 10px 16px;
        font-weight: 600;
        font-size: 0.8rem;
        color: var(--ink-soft);
        border-bottom: 2px solid var(--ink);
    }
    td {
        padding: 12px 16px;
        font-size: 0.92rem;
        border-bottom: 1px solid var(--rule);
    }
    tr:last-child td { border-bottom: 1px solid var(--ink); }
    tbody tr:nth-child(even) td { background: rgba(31, 111, 82, 0.035); }
    .name { font-weight: 600; }
    .gpa, .score {
        font-family: 'Source Serif 4', Georgia, serif;
        font-weight: 600;
        color: var(--emerald);
    }
    .course-id { font-weight: 600; color: var(--brass); }
    .tag {
        display: inline-block;
        padding: 2px 9px;
        border: 1px solid currentColor;
        border-radius: 3px;
        font-size: 0.78rem;
        font-weight: 600;
    }
    .grade-a, .grade-b { color: var(--emerald); }
    .grade-c { color: var(--amber); }
    .grade-d, .grade-f { color: var(--rust); }
    .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 0.88rem;
        font-weight: 500;
    }
    .status::before {
        content: '';
        width: 7px; height: 7px;
        border-radius: 50%;
        background: currentColor;
    }
    .present { color: var(--emerald); }
    .absent { color: var(--rust); }
    .empty {
        border: 1px dashed var(--rule);
        background: var(--paper-raised);
        padding: 36px;
        text-align: center;
        color: var(--ink-soft);
        font-style: italic;
        margin-bottom: 8px;
    }
    .record-card {
        border: 1px solid var(--rule);
        background: var(--paper-raised);
        padding: 6px 28px;
        margin: 20px 0 8px;
    }
    .record-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }
    .record-field {
        padding: 18px 20px 18px 0;
        border-bottom: 1px solid var(--rule);
    }
    .record-label {
        font-size: 0.72rem;
        color: var(--ink-soft);
        margin-bottom: 5px;
    }
    .record-value {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--ink);
    }
    .highlight-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        padding: 22px 28px;
        margin: 20px 0 10px;
        background: var(--paper-raised);
        border: 1px solid var(--rule);
    }
    .highlight-item {
        min-width: 150px;
    }
    .highlight-label {
        font-size: 0.75rem;
        color: var(--ink-soft);
        margin-bottom: 4px;
    }
    .highlight-value {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 1.55rem;
        font-weight: 600;
        color: var(--emerald);
    }
    .progress {
        width: 100%;
        height: 7px;
        background: var(--rule);
        margin-top: 8px;
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        background: var(--emerald);
    }
    .summary-strip {
        display: flex;
        flex-wrap: wrap;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        margin: 24px 0 10px;
    }
    .summary-item {
        flex: 1;
        min-width: 150px;
        padding: 26px 22px;
        border-right: 1px solid var(--rule);
    }
    .summary-item:last-child { border-right: none; }
    .summary-label {
        font-size: 0.8rem;
        color: var(--ink-soft);
        margin-bottom: 10px;
    }
    .summary-count {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 2.3rem;
        font-weight: 600;
        color: var(--ink);
    }
    .summary-bar {
        width: 26px; height: 3px;
        background: var(--brass);
        margin-top: 10px;
    }
    .report-footer {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid var(--rule);
        text-align: center;
        font-family: 'Source Serif 4', Georgia, serif;
        font-style: italic;
        font-size: 0.8rem;
        color: var(--ink-soft);
    }
    @media (max-width: 700px) {
        .letterhead, .title-bar, .content {
            padding-left: 24px;
            padding-right: 24px;
        }
        .letterhead-text h1 { font-size: 1.4rem; }
        table { display: block; overflow-x: auto; }
        .summary-item {
            border-right: none;
            border-bottom: 1px solid var(--rule);
        }
        .summary-item:last-child { border-bottom: none; }
    }
</style></head><body><div class='letterhead'><div class='seal'>SMS</div><div class='letterhead-text'><h1>Student Management System</h1><p>Academic Records</p></div></div><div class='title-bar'><h2>Grades Report</h2><span class='date'>September 10, 2026</span></div><div class='content'><table><thead><tr><th>Student</th><th>Course</th><th>Score</th><th>Letter Grade</th></tr></thead><tbody><tr><td class='name'>Mahmoud Bakri</td><td>Software Testing</td><td class='score'>90.0</td><td><span class='tag grade-a'>A</span></td></tr></tbody></table><div class='report-footer'>Issued by the Student Management System</div></div></body></html>
